# PROJETO GARCOM - automatiza o version.txt a partir do firmware.bin
#
# O QUE FAZ: toda vez que um firmware.bin muda - na RAIZ (legado) ou dentro
# da pasta de um Gateway (ex: esp32_A4-CF-12-F0-93-90/firmware.bin) - esta
# Action calcula o hash do arquivo e grava no version.txt DA MESMA PASTA.
#
# Atualizacao 27/09/2026 (OTA por dispositivo): a compilar-firmware.yml ja
# grava o version.txt junto com o firmware.bin, entao quando ela e quem
# gerou o .bin, esta Action so confere e sai sem commitar ("Nada mudou").
# Ela continua util quando voce sobe um firmware.bin MANUALMENTE (exportado
# pelo Arduino IDE) direto numa pasta - o version.txt e calculado aqui.
#
# O filtro "paths" so dispara quando algum firmware.bin muda de verdade, e
# o commit que esta Action faz so mexe em version.txt - sem loop.

name: Atualizar version.txt a partir do firmware.bin

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware.bin'
      - '**/firmware.bin'

permissions:
  contents: write

concurrency:
  group: atualizar-versao
  cancel-in-progress: false

jobs:
  atualizar-versao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calcular hash de cada firmware.bin alterado e gravar o version.txt ao lado
        env:
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${ANTES:-}" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            BASE="$ANTES"
          else
            BASE="HEAD~1"
          fi
          # ':(glob)**/firmware.bin' pega a raiz E qualquer subpasta
          BINS=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- ':(glob)**/firmware.bin' || true)
          : > "$RUNNER_TEMP/versoes.txt"
          while IFS= read -r BIN; do
            [ -z "$BIN" ] && continue
            PASTA=$(dirname "$BIN")
            HASH=$(sha256sum "$BIN" | cut -c1-12)
            echo "$BIN -> $PASTA/version.txt = $HASH"
            echo -n "$HASH" > "$PASTA/version.txt"
            echo "$PASTA/version.txt" >> "$RUNNER_TEMP/versoes.txt"
          done <<< "$BINS"

      - name: Commitar version.txt (so se realmente mudou)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -s "$RUNNER_TEMP/versoes.txt" ]; then
            echo "Nenhum firmware.bin alterado."
            exit 0
          fi
          xargs -a "$RUNNER_TEMP/versoes.txt" git add --
          if git diff --cached --quiet; then
            echo "Nada mudou, nada pra commitar."
            exit 0
          fi
          git commit -m "Atualiza version.txt automaticamente a partir do firmware.bin"
          for TENTATIVA in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push falhou (tentativa $TENTATIVA) - tentando de novo em 5s..."
            sleep 5
          done
          echo "::error::Nao consegui fazer push depois de 3 tentativas."
          exit 1
